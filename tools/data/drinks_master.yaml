  ice: none
  garnish: null
  garnish_icon: none
  ing: ["45 gin", "15 lime_juice", "15 lemon_juice", "30 simple_syrup", "60 heavy_cream", "30 egg_white",
        "3 dash orange_flower_water", "2 dash vanilla_extract | Vanilla extract (2 drops)", "60 top soda_water"]
  steps:
    - Shake everything except the soda without ice for 15 seconds.
    - Add ice and shake very hard for at least 30 seconds more.
    - Strain into a chilled Collins glass with no ice.
    - Let it settle for a minute, then pour soda slowly down the side so the foam rises above the rim.

