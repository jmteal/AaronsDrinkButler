  garnish_icon: sugar_rim
  ing: ["52.5 cognac | Brandy", "7.5 maraschino_liqueur", "1 barspoon orange_curacao", "15 lemon_juice",
        "1 barspoon simple_syrup", "2 dash angostura_bitters", "- pinch sugar rim | Sugar for the rim"]
  steps:
    - Rub the rim of a small wine glass with a lemon or orange slice and dip it in sugar.
    - Cut a long, wide strip of lemon peel and curl it around the inside of the glass.
    - Shake the brandy, maraschino, curaçao, lemon juice, syrup and bitters with ice.
    - Strain into the prepared glass.
  wiki: Brandy crusta

