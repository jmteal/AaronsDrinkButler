# Aaron's Drink Butler: curated master list (the source of truth for data/recipes.json).
#
# Specs (ingredients and amounts) are facts, checked against the IBA site for IBA drinks
# and against Wikidata / TheCocktailDB for everything (see tools/data/reports/crosscheck.md).
# Steps are generated in our own words from the structured spec by adb/steps.py, unless a
# drink gives its own `steps:` (also our own words). Text license: CC BY 4.0.
#
# Per-drink fields:
#   id, name, aka[]         id is a stable slug (favorites and pantry are keyed by it)
#   iba                     unforgettable | contemporary_classic | new_era (omit if not IBA)
#   iba_slug                IBA page slug when it differs from id with - for _
#   glass, method, ice      see data/SCHEMA.md for allowed values
#   garnish, garnish_icon   garnish text (null for none) and the icon used to draw it
#   ing                     list of "<amount> [unit] <ingredient_id> [flags] [| display]"
#                             amount: number, or - for none; unit defaults to ml
#                             units: ml dash barspoon tsp cube piece leaf top pinch
#                             "top" means top up; its amount is an approximate ml for ABV
#                             flags: opt (optional), muddle, rim, rinse, float, sink, foam,
#                                    side (served alongside, not mixed in)
#   prep / finish           extra first / last step added to the generated steps
#   steps                   full replacement for the generated steps
#   wiki                    English Wikipedia title (used to find Wikidata item and photo)
#   qid                     Wikidata item, if the wiki title doesn't resolve it
#   doubt                   a note on a spec we are unsure about (listed in the report)

