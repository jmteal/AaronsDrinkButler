- id: mulled_wine
  name: Mulled Wine
  aka: [Glühwein, Vin Chaud]
  glass: irish_coffee_mug
  method: hot
  ice: none
  garnish: Orange slice and a cinnamon stick
  garnish_icon: cinnamon
  ing: ["150 red_wine", "15 honey | Honey or sugar, to taste", "1 piece orange | 2 orange slices", "3 piece cloves", "1 piece cinnamon",
        "1 piece star_anise opt", "15 cognac opt | Brandy (optional)"]
  steps:
    - Put the wine, honey, orange slices and spices in a small pan.
    - Warm gently for 10 minutes without letting it boil.
    - Stir in the brandy, if using, and taste for sweetness.
    - Strain into a heatproof mug and garnish with an orange slice and a cinnamon stick.
  wiki: Mulled wine

- id: sangria
  name: Sangria
  glass: wine
  method: built
  ice: cubes
  garnish: Slices of orange and lemon
  garnish_icon: orange_slice
  ing: ["120 red_wine", "15 cognac | Spanish brandy", "15 triple_sec", "30 orange_juice", "10 simple_syrup", "1 piece orange | Orange slices",
        "1 piece lemon | Lemon slices", "30 top soda_water opt"]
  steps:
    - Combine the wine, brandy, triple sec, orange juice, syrup and fruit slices (this scales up well for a pitcher).
    - Chill for at least an hour so the fruit flavors the wine.
    - Pour over ice in a wine glass, with some of the fruit.
    - Top with a splash of soda if you like it lighter.
  wiki: Sangria

