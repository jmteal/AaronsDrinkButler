  steps:
    - Chill a rocks glass with ice water.
    - In a mixing glass, soak the sugar cube with the bitters and a few drops of water and crush it.
    - Add the cognac and ice and stir for about 20 seconds.
    - Empty the chilled glass, coat the inside with absinthe and pour out the excess.
    - Strain the drink into the glass (no ice) and twist a lemon peel over the top.
  wiki: Sazerac

