# Normalized ingredient table (source of truth for data/ingredients.json).
#
# Fields:
#   name      display name in the My Bar list and default ingredient label
#   short     wording used inside generated steps (defaults to name, lower-cased)
#   cat       spirit | liqueur | wine | mixer | juice | syrup | bitters | dairy | egg | garnish | other
#   abv       % alcohol by volume (0 if omitted); used for the ABV estimate
#   base      base_spirit tag value when this is the largest alcoholic ingredient
#   sub       ingredient ids that can stand in for this one (pantry counts them as present)
#   essential pantry_essential flag (shown first in My Bar)
#   pantry    false = never asked about in My Bar (water, ice)
#   aliases   extra names used only to map reference data (IBA, TheCocktailDB, Wikidata)
#
# Category names shown in the UI live in CATEGORY_LABELS in adb/emit.py.

